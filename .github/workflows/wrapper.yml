name: Wrapper CI/CD Pipeline (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  call-ci:
    name: Call CI Pipeline
    uses: ./.github/workflows/ci.yml

  call-cd:
    name: Call CD Pipeline
    needs: call-ci
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      deploy-to-prod: false

  wrapper-summary:
    name: Wrapper Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ call-ci, call-cd ]
    if: always()
    
    steps:
    - name: Pipeline Summary
      run: |
        echo "## Wrapper CI/CD Pipeline Complete (Develop Branch)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status" >> $GITHUB_STEP_SUMMARY
        echo "- **CI Pipeline**: ${{ needs.call-ci.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **CD Pipeline**: ${{ needs.call-cd.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: Preview/Development" >> $GITHUB_STEP_SUMMARY
