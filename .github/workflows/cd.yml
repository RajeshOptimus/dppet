name: CD Pipeline

on:
  workflow_call:
    inputs:
      deploy-to-prod:
        description: 'Deploy to production'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Vercel (Production)
      if: ${{ inputs.deploy-to-prod }}
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'

    - name: Deploy to Vercel (Preview)
      if: ${{ !inputs.deploy-to-prod }}
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Deployment Status
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "✓ Deployment to Vercel completed successfully" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.deploy-to-prod }}" == "true" ]; then
          echo "✓ Deployed to **Production**" >> $GITHUB_STEP_SUMMARY
        else
          echo "✓ Deployed to **Preview** (Dev Environment)" >> $GITHUB_STEP_SUMMARY
        fi
