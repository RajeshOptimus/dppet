name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci:
    name: CI Pipeline
    uses: ./.github/workflows/ci.yml

  cd:
    name: CD Pipeline
    needs: ci
    if: github.event_name == 'push'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    with:
      deploy-to-prod: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

  summary:
    name: CI/CD Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ ci, cd ]
    if: always()
    
    steps:
    - name: Pipeline Summary
      run: |
        echo "## CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status" >> $GITHUB_STEP_SUMMARY
        echo "- **CI Pipeline**: ${{ needs.ci.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **CD Pipeline**: ${{ needs.cd.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
          echo "**Environment**: Production 🚀" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Environment**: Preview/Development 🧪" >> $GITHUB_STEP_SUMMARY
        fi
